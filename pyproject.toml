[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-headroom"
dynamic = ["version"]
description = "Estimate how much more load a vLLM deployment can take before it breaks its latency SLO"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "httpx>=0.25"]
keywords = ["vllm", "llm", "inference", "capacity-planning", "slo", "queueing", "simulation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vllm-headroom = "vllm_headroom.cli:main"

[tool.setuptools.dynamic]
version = {attr = "vllm_headroom.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
